[project]
name = "proton-agent"
version = "0.1.0"
description = "Proton: An autonomous Data Science Agent you talk to through a terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "google-generativeai>=0.8.0",
    "openpyxl>=3.1.0",
    "prompt-toolkit>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.9",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "optuna>=4.9.0",
]


[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
prot = "proton_agent.cli.app:main"
proton = "proton_agent.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proton_agent"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.0",
]

